name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Data check
        run: |
          test -f data/raw/titanic.csv.dvc

      - name: Smoke load
        run: |
          if [ ! -f data/raw/titanic.csv ]; then
            mkdir -p data/raw
            printf "PassengerId,Survived\n1,0\n2,1\n" > data/raw/titanic.csv
          fi
          python src/load_data.py