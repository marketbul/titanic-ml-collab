name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Data check
        run: |
          test -f data/raw/titanic.csv.dvc
          if [ ! -f data/raw/titanic.csv ]; then
            cat << 'EOF' > data/raw/titanic.csv
PassengerId,Survived
1,0
EOF
          fi

      - name: Smoke train
        run: python src/load_data.py